<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
    <title>ws-Chat</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #root { height: 100%; display: flex; flex-direction: column; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var shown = 0;
        var seen = {};
        window.addEventListener("error", function (e) {
          var msg = e.message || (e.error && e.error.message) || "unknown error";
          if (seen[msg]) return; // 同樣錯誤只顯示一次，避免無限堆疊拖垮畫面
          seen[msg] = true;
          if (shown >= 5) return;
          shown++;
          var d = document.createElement("pre");
          d.style.cssText = "color:#b00;padding:8px;font-size:12px;white-space:pre-wrap;";
          d.textContent = "Error: " + msg + "\n" + (e.error && e.error.stack ? e.error.stack : "");
          document.body.appendChild(d);
        });
      })();
    </script>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
