<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ws-Chat</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/quasar@2.14.0/dist/quasar.prod.css" rel="stylesheet" type="text/css">
  <style>
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #fff;
      font: 1rem sans-serif; color: #666;
    }
    #loading-overlay .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div>loading...</div>
  <div id="q-app" style="display:none">
    <div class="q-pa-md">
      <q-layout view="lHh lpr lFf" container style="height: 400px" class="shadow-2 rounded-borders">
        <q-header elevated>
          <q-toolbar>
            <q-avatar>
              <div class="q-gutter-md" style="font-size: 2em">
                <q-icon name="forum" />
              </div>
            </q-avatar>

            <q-toolbar-title>
              ws-Chat 即時聊天 - {{ userName || '連線中...' }}
            </q-toolbar-title>

            <q-avatar title="點擊查看線上用戶" @click="showUserList" style="cursor: pointer">
              <div class="q-gutter-md">
                <q-icon name="people_alt" style="font-size: 1.6em;"/>
              </div>
              <q-badge color="red" floating transparent>
                {{ onlineCount }}
              </q-badge>
            </q-avatar>

            <q-btn flat round dense icon="logout" @click="disconnectWebSocket" title="離開聊天" style="padding-left: 1.2em;"></q-btn>
          </q-toolbar>
        </q-header>

        <q-page-container>
          <q-page padding>
            <!-- 聊天訊息 -->
            <p id="msgArea" style="font-size:16px;white-space: pre-line;">{{ msgWindow }}</p>
          </q-page>
        </q-page-container>
      </q-layout>
    </div>

    <div class="q-pa-md">
      <q-input standout bottom-slots v-model="inputText" label="輸入框" maxlength="200" @keyup.enter="sendInputMsg">
        <template v-slot:before>
          <q-avatar>
            <span class="material-icons" style="font-size: 2.2em">
              sentiment_satisfied_alt
            </span>
          </q-avatar>
        </template>

        <template v-slot:append>
          <q-btn round dense flat icon="rocket" style="color: red; font-size:1em; padding-right: 5px;" @click="sendRocket" title="抖內發射"></q-btn>
          <q-icon v-if="inputText !== ''" name="close" @click="inputText = ''" class="cursor-pointer" title="清空" />
        </template>

        <template v-slot:after>
          <q-btn round dense flat icon="send" @click="sendInputMsg" title="發送訊息" />
        </template>
      </q-input>
    </div>

    <q-separator />

  </div>

  <footer>
    <p align="center" style="padding-top: 1em; color: grey;">＊ 這是個 DEMO 頁面，程式碼在 <a href="https://github.com/ss-vip/ws-chat">Github</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quasar@2.14.0/dist/quasar.umd.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quasar@2.14.0/dist/lang/zh-TW.umd.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script>
    const { useQuasar } = Quasar
    const { ref, nextTick } = Vue

    const app = Vue.createApp({
      setup () {
        Quasar.lang.set(Quasar.lang.zhTW)
        const $q = useQuasar()

        const userName = ref("")
        const onlineCount = ref(0)
        const inputText = ref("")
        const msgWindow = ref("")
        const users = ref([])
        let ws = null
        const url = `${location.protocol === "http:" ? "ws://" : "wss://"}${location.hostname}${location.port ? ':' + location.port : ''}`

        function connectWebSocket() {
          return Promise.race([
            new Promise((resolve) => {
              ws = new WebSocket(url)
              ws.onopen = resolve
              ws.onmessage = response => {
                const res = JSON.parse(response.data)
                switch (res.event) {
                  case "onlineCount":
                    onlineCount.value = res.data
                    break
                  case "userList":
                    users.value = res.data
                    break
                  case "getRocket":
                    msgWindow.value += res.data + "\n"
                    getRocket()
                    scrollToBottom()
                    break
                  default:
                    msgWindow.value += res.data + "\n"
                    scrollToBottom()
                    break
                }
              }
              ws.onclose = () => {
                console.log('WebSocket closed')
              }
            }),
            new Promise((_, reject) =>
              setTimeout(() => reject(new Error('連線超時')), 5000)
            )
          ])
        }

        function scrollToBottom() {
          nextTick(() => {
            document.getElementById('msgArea')?.scrollIntoView(false)
          })
        }

        async function inputName() {
          if (!ws || ws.readyState !== WebSocket.OPEN) {
            try {
              await connectWebSocket()
            } catch {
              $q.notify({ message: '無法連線到伺服器', color: 'negative' })
              return
            }
          }
          $q.dialog({
            title: '設定暱稱',
            message: '請輸入暱稱',
            prompt: { model: userName, type: 'text' },
            cancel: false,
            persistent: true
          }).onOk(() => {
            if (userName.value) {
              sendWS("setName", userName.value)
              $q.notify({ message: "Welcome! " + userName.value, color: 'purple' })
            } else {
              inputName()
            }
          })
        }

        if (!userName.value) {
          inputName()
        }

        function disconnectWebSocket() {
          if (ws) {
            ws.close()
            userName.value = null
            inputName()
          }
        }

        function sendInputMsg() {
          if (!inputText.value) return
          sendWS('message', inputText.value)
          inputText.value = ''
        }

        function sendRocket() {
          $q.notify({ message: '發射火箭', color: 'green' })
          sendWS('sendRocket', userName.value)
        }

        function sendWS(event, data) {
          if (event && data && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ event, data }))
          } else {
            $q.notify({ message: '訊息發送失敗', color: 'purple' })
          }
        }

        function getRocket() {
          confetti()
          setTimeout(() => confetti.reset(), 3000)
        }

        function showUserList() {
          $q.dialog({
            title: `線上用戶 (${onlineCount.value})`,
            message: users.value.length
              ? users.value.map(n => `👤 ${n}`).join('\n')
              : '尚無其他用戶'
          })
        }

        return {
          userName, onlineCount, inputText, msgWindow, users,
          sendInputMsg, sendWS, connectWebSocket, disconnectWebSocket,
          sendRocket, getRocket, showUserList
        }
      }
    })

    app.use(Quasar, { config: {} })
    app.mount('#q-app')
    document.getElementById('loading-overlay')?.remove()
    document.getElementById('q-app').style.display = ''
  </script>
</body>
</html>
