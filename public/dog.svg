<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="狗狗">
  <g>
    <!-- 彈跳：整體上下 -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -11; 0 0" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>

    <!-- 左耳（擺動） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-9 24 32; 7 24 32; -9 24 32" dur="0.9s" repeatCount="indefinite"/>
      <ellipse cx="24" cy="38" rx="9.5" ry="18" fill="#8a5a33"/>
    </g>

    <!-- 右耳（擺動，相位相反） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="9 72 32; -7 72 32; 9 72 32" dur="0.9s" repeatCount="indefinite"/>
      <ellipse cx="72" cy="38" rx="9.5" ry="18" fill="#8a5a33"/>
    </g>

    <!-- 頭 -->
    <ellipse cx="48" cy="47" rx="27" ry="24" fill="#c98d52"/>
    <ellipse cx="33" cy="34" rx="7" ry="5" fill="#d9a26c" opacity="0.55"/>

    <!-- 吻部 -->
    <ellipse cx="48" cy="61" rx="16" ry="11" fill="#f7e6cb"/>

    <!-- 左眼（眨眼） -->
    <ellipse cx="38" cy="43" rx="3.4" ry="3.4" fill="#2b1d12">
      <animate attributeName="ry" values="3.4;3.4;0.4;3.4;3.4" keyTimes="0;0.85;0.9;0.95;1"
        dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 右眼（眨眼） -->
    <ellipse cx="58" cy="43" rx="3.4" ry="3.4" fill="#2b1d12">
      <animate attributeName="ry" values="3.4;3.4;0.4;3.4;3.4" keyTimes="0;0.85;0.9;0.95;1"
        dur="2.6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 鼻子與嘴 -->
    <ellipse cx="48" cy="56" rx="5" ry="3.8" fill="#2b1d12"/>
    <path d="M48 60 q0 5 -6.5 6.5 M48 60 q0 5 6.5 6.5" stroke="#2b1d12" stroke-width="1.6"
      fill="none" stroke-linecap="round"/>
    <!-- 舌頭（微彈） -->
    <path d="M44.5 65 q3.5 8 7 0 z" fill="#ef6d6d">
      <animate attributeName="opacity" values="1;1;0.7;1" keyTimes="0;0.5;0.55;1" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
